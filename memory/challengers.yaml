# Strategies tracked forward from their `since` date (out-of-sample by construction).
# `trader review` simulates each one and compares them. Rules for promoting a challenger to
# live are in CLAUDE.md. Add new ideas here (with today's date as `since`) instead of
# switching live on backtest evidence alone. Never edit `since` on an existing entry.
champion: core_spy_qqq

challengers:
  core_spy_qqq:
    kind: fixed
    since: 2026-11-04
    weights: {SPY: 0.5, QQQ: 0.5}
    note: Live from 2026-11-05. Backtest 2017-26 CAGR 17.3%, Sharpe 0.94, maxDD -31%.
  spy_only:
    kind: fixed
    since: 2026-11-04
    weights: {SPY: 1.0}
    note: The benchmark. Anything live must beat this to be worth the effort.
  qqq_only:
    kind: fixed
    since: 2026-11-04
